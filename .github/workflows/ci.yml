name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS (Xcode ${{ matrix.xcode }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "26.1.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Run tests
        run: swift test

  build-linux:
    name: ${{ matrix.os }} (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            swift: "6.2"
          - os: ubuntu-22.04
            swift: "6.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Run tests
        run: swift test

  build-wasm:
    name: WebAssembly (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            swift: "6.4.0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Install SDK download tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl

      - name: Install WebAssembly SDK
        run: |
          curl --fail --location --retry 3 --output /tmp/swift-wasm-sdk.tar.gz \
            https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
          echo "f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d  /tmp/swift-wasm-sdk.tar.gz" | sha256sum --check
          swift sdk install /tmp/swift-wasm-sdk.tar.gz \
            --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d

      - name: Configure WebAssembly runner
        run: |
          # Native SwiftPM resource accessors work on WASI. The Swift Build backend
          # currently uses Bundle.main, which is unsupported by the WASI SDK.
          cat > /tmp/wasm-toolset.json <<EOF
          {
            "schemaVersion": "1.0",
            "testRunner": {
              "path": "$(command -v wasmkit)",
              "extraCLIOptions": ["run", "--stack-size", "67108864", "--dir", "/tmp", "--dir", "$GITHUB_WORKSPACE"]
            }
          }
          EOF

      - name: Build WebAssembly tests
        run: >-
          swift build -c release --build-system native --build-tests --disable-xctest --jobs 4
          --swift-sdk swift-${{ matrix.swift }}-RELEASE_wasm
          --scratch-path /tmp/wasm-build
          -Xswiftc -enable-testing
          -Xlinker -z -Xlinker stack-size=8388608

      - name: Run WebAssembly tests
        run: >-
          swift test -c release --build-system native --skip-build --disable-xctest --no-parallel
          --toolset /tmp/wasm-toolset.json
          --swift-sdk swift-${{ matrix.swift }}-RELEASE_wasm
          --scratch-path /tmp/wasm-build
